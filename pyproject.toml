[project]
name = "macro"
version = "0.1.0"
description = "Macro Team, Trading Club @ GT: macro signals for S&P 500 volatility."
requires-python = ">=3.12"
dependencies = [
    "exchange-calendars>=4.13.2,<5",
    "fredapi>=0.5.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1,<4",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "yfinance>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["macro"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# exchange-calendars relies on Series.values behaviour that pandas 4 changes; pandas is capped <4.
filterwarnings = ["ignore:Series.values returning an ndarray:pandas.errors.Pandas4Warning"]

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
